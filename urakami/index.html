<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>裏紙メモ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="裏紙">
<meta name="theme-color" content="#fdfcf7">
<meta name="robots" content="noindex">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #fdfcf7;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  #paper { position: fixed; inset: 0; background-color: #fdfcf7; }
  #paper.grid {
    background-image:
      linear-gradient(rgba(60, 90, 140, .13) 1px, transparent 1px),
      linear-gradient(90deg, rgba(60, 90, 140, .13) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  canvas { position: absolute; inset: 0; display: block; touch-action: none; }
  #t { pointer-events: none; }
  #hint {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: rgba(0, 0, 0, .12); font-size: 44px; letter-spacing: .15em;
    pointer-events: none; transition: opacity .3s;
  }
  #hint.off { opacity: 0; }

  #bar {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    right: calc(env(safe-area-inset-right, 0px) + 10px);
    z-index: 10;
  }
  #open {
    width: 38px; height: 38px; border-radius: 50%; border: 0; padding: 0;
    background: rgba(0, 0, 0, .07); color: rgba(0, 0, 0, .45);
    font-size: 18px; line-height: 38px;
  }
  #tools {
    display: none; flex-wrap: wrap; gap: 2px; align-items: center; justify-content: flex-end;
    max-width: calc(100vw - 20px);
    padding: 5px 7px; border-radius: 26px;
    background: rgba(255, 255, 255, .94);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    box-shadow: 0 2px 14px rgba(0, 0, 0, .18);
  }
  #bar.open #tools { display: flex; }
  #bar.open #open { display: none; }

  #tools button {
    min-width: 40px; height: 40px; border: 0; border-radius: 20px; padding: 0 10px;
    background: transparent; color: #333; font-size: 14px; font-family: inherit;
  }
  #tools button:active { background: rgba(0, 0, 0, .08); }
  #tools button.on { background: rgba(0, 0, 0, .12); font-weight: 700; }
  #tools .sw { padding: 0; width: 40px; position: relative; }
  #tools .sw i {
    position: absolute; left: 9px; top: 9px; width: 22px; height: 22px; border-radius: 50%;
    box-sizing: border-box; border: 2px solid transparent;
  }
  #tools .sw.on i { border-color: #fff; box-shadow: 0 0 0 2.5px currentColor; }
  #tools .sep { width: 1px; height: 22px; background: rgba(0, 0, 0, .15); margin: 0 4px; }
  #size i { display: inline-block; border-radius: 50%; background: #333; vertical-align: middle; }
  #trash {
    position: fixed; z-index: 9;
    right: calc(env(safe-area-inset-right, 0px) + 8px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
    min-width: 56px; height: 46px; padding: 0 14px; border: 0; border-radius: 23px;
    background: rgba(0, 0, 0, .07); color: rgba(0, 0, 0, .5);
    font-size: 13px; font-family: inherit;
  }
  #trash.arm { background: #d93025; color: #fff; font-weight: 700; }
  #note {
    position: fixed; z-index: 11; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    background: rgba(40, 40, 40, .92); color: #fff; font-size: 14px;
    padding: 8px 8px 8px 16px; border-radius: 24px;
  }
  #note[hidden] { display: none; }
  #note button {
    margin-left: 8px; border: 0; border-radius: 18px; height: 36px; padding: 0 14px;
    background: #fff; color: #222; font-size: 14px; font-family: inherit;
  }
</style>
</head>
<body>
<div id="paper"></div>
<canvas id="c"></canvas>
<canvas id="t"></canvas>
<div id="hint">ここに書く</div>

<div id="bar">
  <button id="open" aria-label="ツールを開く">✎</button>
  <div id="tools">
    <button class="sw" data-color="#1b1b1b" style="color:#1b1b1b" aria-label="黒"><i style="background:#1b1b1b"></i></button>
    <button class="sw" data-color="#d93025" style="color:#d93025" aria-label="赤"><i style="background:#d93025"></i></button>
    <button class="sw" data-color="#1a56db" style="color:#1a56db" aria-label="青"><i style="background:#1a56db"></i></button>
    <button class="sw" data-color="#188038" style="color:#188038" aria-label="緑"><i style="background:#188038"></i></button>
    <button id="size" aria-label="太さ"><i></i></button>
    <button id="eraser">消しゴム</button>
    <span class="sep"></span>
    <button id="undo">戻す</button>
    <span class="sep"></span>
    <button id="grid">方眼</button>
    <button id="fs">全画面</button>
    <button id="close" aria-label="閉じる">✕</button>
  </div>
</div>

<button id="trash">捨てる</button>
<div id="note" hidden>ペンとして認識されていません <button id="allowFinger">指でも書けるようにする</button></div>

<script>
(function () {
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var tv = document.getElementById('t');
  var tctx = tv.getContext('2d');
  var paper = document.getElementById('paper');
  var hint = document.getElementById('hint');
  var bar = document.getElementById('bar');
  var W = 0, H = 0, dpr = 1;

  var SIZES = [1.5, 3, 6, 12];
  var state = { color: '#1b1b1b', sizeIdx: 2, eraser: false, grid: false, finger: false };
  var strokes = [];
  var cleared = null;
  var lastErase = null;
  var cur = null;
  var penSeen = false;
  var blocked = 0;
  var note = document.getElementById('note');

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // ---- 保存の読み込み ----
  try {
    var p = JSON.parse(lsGet('urakami.prefs') || 'null');
    if (p) {
      if (typeof p.color === 'string') state.color = p.color;
      if (p.sizeIdx >= 0 && p.sizeIdx < SIZES.length) state.sizeIdx = p.sizeIdx;
      state.grid = !!p.grid;
    }
    var sv = JSON.parse(lsGet('urakami.strokes') || 'null');
    if (Array.isArray(sv)) strokes = sv;
  } catch (e) { strokes = []; }

  function savePrefs() {
    lsSet('urakami.prefs', JSON.stringify({ color: state.color, sizeIdx: state.sizeIdx, grid: state.grid }));
  }
  function saveStrokes() {
    var s = JSON.stringify(strokes, function (k, v) {
      return typeof v === 'number' ? Math.round(v * 10) / 10 : v;
    });
    if (s.length < 3000000) lsSet('urakami.strokes', s);
  }

  // ---- 描画 ----
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    tv.width = cv.width; tv.height = cv.height;
    tv.style.width = W + 'px'; tv.style.height = H + 'px';
    redraw();
  }
  function mid(a, b) { return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; }
  function lw(s, pr) { return s.eraser ? s.w * 4 : s.w * (0.5 + pr); }
  function style(s) {
    ctx.globalCompositeOperation = s.eraser ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.color; ctx.fillStyle = s.color;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  }
  function seg(s, i) {
    var p = s.pts;
    var a = i <= 1 ? p[0] : mid(p[i - 2], p[i - 1]);
    var c = p[i - 1];
    var b = mid(p[i - 1], p[i]);
    style(s);
    ctx.lineWidth = lw(s, (p[i - 1][2] + p[i][2]) / 2);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]);
    ctx.quadraticCurveTo(c[0], c[1], b[0], b[1]);
    ctx.stroke();
  }
  function finish(s) {
    var p = s.pts, n = p.length;
    style(s);
    if (n === 1) {
      ctx.beginPath(); ctx.arc(p[0][0], p[0][1], lw(s, p[0][2]) / 2, 0, Math.PI * 2); ctx.fill();
    } else {
      var a = mid(p[n - 2], p[n - 1]);
      ctx.lineWidth = lw(s, p[n - 1][2]);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(p[n - 1][0], p[n - 1][1]); ctx.stroke();
    }
  }
  function drawStroke(s) {
    for (var i = 1; i < s.pts.length; i++) seg(s, i);
    finish(s);
  }
  function redraw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (var i = 0; i < strokes.length; i++) drawStroke(strokes[i]);
    hint.classList.toggle('off', strokes.length > 0 || !!cur);
  }

  // ペン先の「いま」まで線をのばす（確定した線は中点までしか描かないため、遅れて見えるのを防ぐ）
  function drawTail(s, extra) {
    tctx.setTransform(1, 0, 0, 1, 0, 0);
    tctx.clearRect(0, 0, tv.width, tv.height);
    if (s.eraser) return;
    var p = s.pts, n = p.length;
    tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    tctx.strokeStyle = s.color; tctx.lineCap = 'round'; tctx.lineJoin = 'round';
    tctx.lineWidth = lw(s, p[n - 1][2]);
    var a = n >= 2 ? mid(p[n - 2], p[n - 1]) : p[0];
    tctx.beginPath(); tctx.moveTo(a[0], a[1]);
    tctx.lineTo(p[n - 1][0], p[n - 1][1]);
    for (var i = 0; i < extra.length; i++) tctx.lineTo(extra[i][0], extra[i][1]);
    tctx.stroke();
  }
  function clearTail() {
    tctx.setTransform(1, 0, 0, 1, 0, 0);
    tctx.clearRect(0, 0, tv.width, tv.height);
  }

  // ---- ぐしゃぐしゃ消し（往復して塗りつぶすと、その下の字が消える） ----
  function reversals(p, ax, extent) {
    if (extent < 20) return 0;
    var T = Math.max(8, extent * 0.2);
    var dir = 0, ext = p[0][ax], rev = 0;
    for (var i = 1; i < p.length; i++) {
      var v = p[i][ax];
      if (dir === 0) {
        if (v - ext >= T) { dir = 1; ext = v; }
        else if (ext - v >= T) { dir = -1; ext = v; }
      } else if (dir === 1) {
        if (v > ext) ext = v;
        else if (ext - v >= T) { dir = -1; ext = v; rev++; }
      } else {
        if (v < ext) ext = v;
        else if (v - ext >= T) { dir = 1; ext = v; rev++; }
      }
    }
    return rev;
  }
  function scribbleBox(s) {
    var p = s.pts;
    if (s.eraser || p.length < 12) return null;
    var minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9, len = 0;
    for (var i = 0; i < p.length; i++) {
      if (p[i][0] < minx) minx = p[i][0]; if (p[i][0] > maxx) maxx = p[i][0];
      if (p[i][1] < miny) miny = p[i][1]; if (p[i][1] > maxy) maxy = p[i][1];
      if (i) len += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
    }
    var w = maxx - minx, h = maxy - miny, diag = Math.hypot(w, h);
    if (diag < 30 || len < diag * 2.5) return null;
    var r = Math.max(reversals(p, 0, w), reversals(p, 1, h));
    if (r < 4) return null;
    return { x1: minx - 10, x2: maxx + 10, y1: miny - 10, y2: maxy + 10 };
  }
  function scribbleHits(box) {
    var hits = [];
    for (var i = 0; i < strokes.length; i++) {
      var q = strokes[i].pts, inside = 0;
      for (var j = 0; j < q.length; j++) {
        if (q[j][0] >= box.x1 && q[j][0] <= box.x2 && q[j][1] >= box.y1 && q[j][1] <= box.y2) inside++;
      }
      if (inside / q.length >= 0.4) hits.push(i);
    }
    return hits;
  }

  // ---- ペン入力 ----
  function pt(e) {
    return [e.clientX, e.clientY, e.pointerType === 'pen' ? (e.pressure || 0.5) : 0.5];
  }
  cv.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'pen' && !penSeen) { penSeen = true; state.finger = false; note.hidden = true; }
    if (cur) return;
    if (e.pointerType === 'touch' && !state.finger) {
      blocked++;
      if (!penSeen && blocked >= 3) note.hidden = false;
      return;
    }
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (x) {}
    cleared = null;
    lastErase = null;
    cur = {
      id: e.pointerId,
      s: { color: state.color, w: SIZES[state.sizeIdx], eraser: state.eraser, pts: [pt(e)] }
    };
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bar.classList.remove('open');
    hint.classList.add('off');
    drawTail(cur.s, []);
  });
  cv.addEventListener('pointermove', function (e) {
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    var s = cur.s;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (var k = 0; k < evs.length; k++) {
      var q = pt(evs[k]);
      var last = s.pts[s.pts.length - 1];
      if (Math.abs(q[0] - last[0]) + Math.abs(q[1] - last[1]) < 0.6) continue;
      s.pts.push(q);
      seg(s, s.pts.length - 1);
    }
    var pr = (e.getPredictedEvents && e.getPredictedEvents()) || [];
    var extra = [];
    for (var j = 0; j < pr.length && j < 3; j++) extra.push(pt(pr[j]));
    drawTail(s, extra);
  });
  function endStroke(e) {
    if (!cur || e.pointerId !== cur.id) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    finish(cur.s);
    clearTail();
    var done = cur.s;
    cur = null;
    var box = scribbleBox(done);
    var hits = box ? scribbleHits(box) : [];
    if (hits.length) {
      lastErase = hits.map(function (i) { return { i: i, s: strokes[i] }; });
      strokes = strokes.filter(function (st, i) { return hits.indexOf(i) < 0; });
      redraw(); saveStrokes();
      return;
    }
    strokes.push(done);
    saveStrokes();
  }
  cv.addEventListener('pointerup', endStroke);
  cv.addEventListener('pointercancel', endStroke);
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  // ---- ツールバー ----
  var swatches = Array.prototype.slice.call(document.querySelectorAll('.sw'));
  var sizeBtn = document.getElementById('size');
  var eraserBtn = document.getElementById('eraser');
  var trashBtn = document.getElementById('trash');
  var gridBtn = document.getElementById('grid');
  var fsBtn = document.getElementById('fs');
  var trashTimer = null;

  function syncUI() {
    swatches.forEach(function (b) {
      b.classList.toggle('on', !state.eraser && b.getAttribute('data-color') === state.color);
    });
    var d = 5 + state.sizeIdx * 4;
    var dot = sizeBtn.querySelector('i');
    dot.style.width = d + 'px'; dot.style.height = d + 'px';
    eraserBtn.classList.toggle('on', state.eraser);
    gridBtn.classList.toggle('on', state.grid);
    gridBtn.textContent = state.grid ? '方眼 ON' : '方眼';
    paper.classList.toggle('grid', state.grid);
  }

  swatches.forEach(function (b) {
    b.addEventListener('click', function () {
      state.color = b.getAttribute('data-color'); state.eraser = false;
      syncUI(); savePrefs();
    });
  });
  sizeBtn.addEventListener('click', function () {
    state.sizeIdx = (state.sizeIdx + 1) % SIZES.length; syncUI(); savePrefs();
  });
  eraserBtn.addEventListener('click', function () { state.eraser = !state.eraser; syncUI(); });
  gridBtn.addEventListener('click', function () { state.grid = !state.grid; syncUI(); savePrefs(); });
  document.getElementById('allowFinger').addEventListener('click', function () {
    state.finger = true; note.hidden = true;
  });

  document.getElementById('undo').addEventListener('click', function () {
    if (cur) return;
    if (lastErase) {
      lastErase.forEach(function (h) { strokes.splice(h.i, 0, h.s); });
      lastErase = null;
    }
    else if (strokes.length) { strokes.pop(); }
    else if (cleared) { strokes = cleared; cleared = null; }
    redraw(); saveStrokes();
  });

  function disarm() {
    trashBtn.classList.remove('arm'); trashBtn.textContent = '捨てる';
    clearTimeout(trashTimer); trashTimer = null;
  }
  var trashType = '';
  trashBtn.addEventListener('pointerdown', function (e) { trashType = e.pointerType; });
  trashBtn.addEventListener('click', function () {
    if (trashType === 'touch' && !state.finger) return;
    if (!trashTimer) {
      trashBtn.classList.add('arm'); trashBtn.textContent = 'ほんとに？';
      trashTimer = setTimeout(disarm, 2500);
      return;
    }
    disarm();
    if (strokes.length) { cleared = strokes; }
    strokes = []; redraw(); saveStrokes();
    bar.classList.remove('open');
  });

  fsBtn.addEventListener('click', function () {
    var el = document.documentElement;
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        var f = el.requestFullscreen || el.webkitRequestFullscreen;
        if (f) { var r = f.call(el); if (r && r.catch) r.catch(function () {}); }
      }
    } catch (x) {}
  });
  if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) {
    fsBtn.style.display = 'none';
  }

  document.getElementById('open').addEventListener('click', function () { bar.classList.add('open'); });
  document.getElementById('close').addEventListener('click', function () { bar.classList.remove('open'); disarm(); });

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 200); });
  syncUI();
  resize();
})();
</script>
</body>
</html>
